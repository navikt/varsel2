APPNAVN=varsel

brukernotifikasjon.beskjed.topic=min-side.aapen-brukernotifikasjon-beskjed-v1

spring.kafka.client-id=test
spring.kafka.bootstrap-servers=127.0.0.1:60172
spring.kafka.security.protocol=PLAINTEXT
spring.kafka.properties.sasl.mechanism=PLAINTEXT
spring.kafka.properties.schema.registry.url=mock://testurl
spring.kafka.properties.specific.avro.reader=true

spring.kafka.ssl.trust-store-location=
spring.kafka.ssl.trust-store-password=

spring.kafka.ssl.key-store-location=
spring.kafka.ssl.key-store-password=
spring.kafka.ssl.key-password=

#kafka producer
spring.kafka.producer.client-id=varsel
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1
spring.kafka.producer.retries=2

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

spring.kafka.consumer.group-id=${APPNAVN}
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.heartbeat-interval=3000
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.properties.allow-manual-commit=true
spring.kafka.properties.bridge-error-handler=true
spring.kafka.properties.break-on-first-error=true

management.endpoint.health.enabled=false

###
spring.main.allow-bean-definition-overriding=true
varsel.serviceuser.username=itestuser
varsel.serviceuser.password=itestpw

# Webservice
digdir_krr_proxy_url=http://localhost:${wiremock.server.port}/digdir-krr-proxy
varsel_sigsubjectcertconstraints=.*DC=test.*DC=local,.*test.local.*,.*DC=preprod.*DC=local,.*preprod.local.*
varsel.endpoints.dokmet-url=http://localhost:${wiremock.server.port}/rest/varselinfo
security.token.rest.service.url=http://localhost:${wiremock.server.port}/securitytoken
pdl.url=http://localhost:${wiremock.server.port}/pdl

bestillservicemelding.queuename=mq_bestillServicemelding
bestillservicemelding.funkfeil.queuename=mq_bestillServicemelding_funkfeil

mqgateway01.hostname=activemq
mqgateway01.port=0
mqgateway01.name=activemq
mqgateway01.channel.securename=activemq
listener.autoStartup=true

azure.openid-config-token-endpoint=http://localhost:${wiremock.server.port}/azure_token
azure.app-client-id=azureClientId
azure.app-client-secret=azureClientSecret
azure.app-scope.digdir.krr=varsel2

wiremock.reset-mappings-after-each-test=true

###
varsel.jms.consumer.error.enable.automatic.shutdown=true
# Number of errors needed to stop a consumer
varsel.jms.consumer.error.context.size=20
# Number of seconds the "number of errors" defined in context.size needs to be within to stop a consumer
varsel.jms.consumer.error.context.time.seconds=600
# Number of seconds to wait before restarting consumer
varsel.jms.consumer.error.restart.delay.seconds=600

varsel.jms.consumer.min=1
varsel.jms.consumer.max=2

varsel.url=http://nav.no/varsel/{id}

