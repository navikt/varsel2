APPNAVN=varsel

spring.kafka.client-id=test
spring.kafka.bootstrap-servers=127.0.0.1:60172
spring.kafka.security.protocol=PLAINTEXT
spring.kafka.properties.sasl.mechanism=PLAINTEXT
spring.kafka.properties.schema.registry.url=mock://testurl

spring.kafka.ssl.trust-store-location=
spring.kafka.ssl.trust-store-password=

spring.kafka.ssl.key-store-location=
spring.kafka.ssl.key-store-password=
spring.kafka.ssl.key-password=

#kafka producer
spring.kafka.producer.client-id=varsel
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1
spring.kafka.producer.retries=2

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.group-id=${APPNAVN}
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.heartbeat-interval=3000
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.properties.allow-manual-commit=true
spring.kafka.properties.bridge-error-handler=true
spring.kafka.properties.break-on-first-error=true

management.endpoint.health.access=none

###
spring.main.allow-bean-definition-overriding=true
varsel.serviceuser.username=srvvarsel
varsel.serviceuser.password=passord

# Webservice
varsel.endpoints.digdir-krr-proxy.url=http://localhost:${wiremock.server.port}/digdir-krr-proxy
varsel.endpoints.digdir-krr-proxy.scope=varsel2
varsel.endpoints.dokmet-url=http://localhost:${wiremock.server.port}/rest/varselinfo
varsel.endpoints.pdl.url=http://localhost:${wiremock.server.port}/pdl
varsel.endpoints.pdl.scope=api://dev-fss.pdl.pdl-api/.default
nais.token-endpoint=http://localhost:${wiremock.server.port}/nais-texas

varsel.queues.bestillservicemelding.queuename=mq_bestillServicemelding
varsel.queues.bestillservicemelding.funkfeil-queuename=mq_bestillServicemelding_funkfeil

mqgateway01.hostname=activemq
mqgateway01.port=0
mqgateway01.name=activemq
mqgateway01.channel.securename=activemq
listener.autoStartup=true

wiremock.reset-mappings-after-each-test=true

# Number of errors needed to stop a consumer
varsel.jms.consumer-error-context-size=20
# Number of seconds the "number of errors" defined in context.size needs to be within to stop a consumer
varsel.jms.consumer-error-context-time-seconds=600
# Number of seconds to wait before restarting consumer
varsel.jms.consumer-error-restart-delay-seconds=600

varsel.url=http://nav.no/varsel/{id}

