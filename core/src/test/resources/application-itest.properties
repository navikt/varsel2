spring.main.allow-bean-definition-overriding=true
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.xa.properties.driver-class-name=org.h2.Driver
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
varsel.serviceuser.username=itestuser
varsel.serviceuser.password=itestpw

# Webservice
digdir_krr_proxy_url=http://localhost:${wiremock.server.port}/DIGDIR_KRR_PROXY
varsel_sigsubjectcertconstraints=.*DC=test.*DC=local,.*test.local.*,.*DC=preprod.*DC=local,.*preprod.local.*
dokmet.varselinfo.url=http://localhost:${wiremock.server.port}/varsel/rest/varselInfoV1
security.token.rest.service.url=http://localhost:${wiremock.server.port}/securitytoken
pdl.url=http://localhost:${wiremock.server.port}/pdl

bestillservicemelding.queuename=mq_bestillServicemelding
bestillservicemelding.funkfeil.queuename=mq_bestillServicemelding_funkfeil

mqgateway01.hostname=activemq
mqgateway01.port=0
mqgateway01.name=activemq
mqgateway01.channel.securename=activemq
listener.autoStartup=true

azure.openid-config-token-endpoint=http://localhost:${wiremock.server.port}/azure_token
azure.app-client-id=azureClientId
azure.app-client-secret=azureClientSecret
azure.app-scope.digdir.krr=varsel2

wiremock.reset-mappings-after-each-test=true
management.endpoint.health.enabled=false

varsel.jms.consumer.error.enable.automatic.shutdown=true
# Number of errors needed to stop a consumer
varsel.jms.consumer.error.context.size=20
# Number of seconds the "number of errors" defined in context.size needs to be within to stop a consumer
varsel.jms.consumer.error.context.time.seconds=600
# Number of seconds to wait before restarting consumer
varsel.jms.consumer.error.restart.delay.seconds=600

varsel.jms.consumer.min=1
varsel.jms.consumer.max=2

varsel.url=http://nav.no/varsel/{id}
