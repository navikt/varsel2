kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{ APP_NAME }}
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  kafka:
    pool: {{ KAFKA_POOL }}
  env:
    - name: AZURE_APP_SCOPE_DIGDIR_KRR
      value: {{AZURE_APP_SCOPE_DIGDIR_KRR}}
    - name: VARSEL_PROXY_HOST
      value: {{VARSEL_PROXY_HOST}}
    - name: VARSEL_PROXY_PORT
      value: "{{VARSEL_PROXY_PORT}}"
    - name: SPRING_DATASOURCE_URL
      value: {{ SPRING_DATASOURCE_URL }}
    - name: MQGATEWAY01_HOSTNAME
      value: {{ MQGATEWAY01_HOSTNAME }}
    - name: MQGATEWAY01_PORT
      value: "{{ MQGATEWAY01_PORT }}"
    - name: MQGATEWAY01_NAME
      value: {{ MQGATEWAY01_NAME }}
    - name: MQGATEWAY01_CHANNEL_NAME
      value: {{ MQGATEWAY01_CHANNEL_NAME }}
    - name: MQGATEWAY01_CHANNEL_SECURENAME
      value: {{ MQGATEWAY01_CHANNEL_SECURENAME }}
    - name: MQGATEWAY01_CHANNEL_ENABLETLS
      value: "{{ MQGATEWAY01_CHANNEL_ENABLETLS }}"
    - name: DIGDIR_KRR_PROXY_URL
      value: {{ DIGDIR_KRR_PROXY_URL }}
    - name: SECURITYTOKENSERVICE_URL
      value: {{ SECURITYTOKENSERVICE_URL }}
    - name: SECURITY_TOKEN_REST_SERVICE_URL
      value: {{ SECURITY_TOKEN_REST_SERVICE_URL }}
    - name: DOKMET_VARSELINFO_URL
      value: {{ DOKMET_VARSELINFO_URL }}
    - name: PDL_URL
      value: {{ PDL_URL }}
    - name: VARSEL_SIGSUBJECTCERTCONSTRAINTS
      value: {{ VARSEL_SIGSUBJECTCERTCONSTRAINTS }}
    - name: BESTILLSERVICEMELDING_QUEUENAME
      value: {{ BESTILLSERVICEMELDING_QUEUENAME }}
    - name: BESTILLSERVICEMELDING_FUNKFEIL_QUEUENAME
      value: {{ BESTILLSERVICEMELDING_FUNKFEIL_QUEUENAME }}
    - name: BESTILLSERVICEMELDINGKONTAKTINFO_QUEUENAME
      value: {{ BESTILLSERVICEMELDINGKONTAKTINFO_QUEUENAME }}
    - name: BESTILLSERVICEMELDINGKONTAKTINFO_FUNKFEIL_QUEUENAME
      value: {{ BESTILLSERVICEMELDINGKONTAKTINFO_FUNKFEIL_QUEUENAME }}
    - name: VARSEL_URL
      value: {{ VARSEL_URL }}
    - name: VARSEL_JMS_CONSUMER_ERROR_CONTEXT_SIZE
      value: "{{ VARSEL_JMS_CONSUMER_ERROR_CONTEXT_SIZE }}"
    - name: VARSEL_JMS_CONSUMER_ERROR_CONTEXT_TIME_SECONDS
      value: "{{ VARSEL_JMS_CONSUMER_ERROR_CONTEXT_TIME_SECONDS }}"
    - name: VARSEL_JMS_CONSUMER_ERROR_RESTART_DELAY_SECONDS
      value: "{{ VARSEL_JMS_CONSUMER_ERROR_RESTART_DELAY_SECONDS }}"
    - name: LISTENER_AUTO_STARTUP
      value: "{{ LISTENER_AUTO_STARTUP }}"
  image: {{ image }}
  ingresses:
    {{#each INGRESSES}}
       - {{ this }}
           {{/each}}
  liveness:
    path: /varsel/actuator/health/liveness
    port: 8080
    initialDelay: 30
    failureThreshold: 10
  port: 8080
  prometheus:
    enabled: true
    path: /varsel/actuator/prometheus
  readiness:
    path: /varsel/actuator/health/readiness
    port: 8080
    initialDelay: 30
    timeout: 3
  replicas:
    min: {{ MIN_REPLICAS }}
    max: {{ MAX_REPLICAS }}
    cpuThresholdPercentage: 50
  resources:
    limits:
      cpu: 3000m
      memory: 3072Mi
    requests:
      memory: 1920Mi
  vault:
    enabled: true
    paths:
      - kvPath: {{ VARSEL_DS }}
        mountPath: /var/run/secrets/nais.io/varselDS
      - kvPath: {{SERVICEUSER_VAULT_PATH}}
        mountPath: /secrets/serviceuser/srvvarsel
      - kvPath: {{ VARSEL_CERT }}
        mountPath: /var/run/secrets/nais.io/certificate
  azure:
    application:
      enabled: true
